name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# DoctrineBundle 2 excludes Symfony 8. ORM 2 is outside the next release baseline.
jobs:
  compatibility:
    name: Compatibility / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PHP 8.3 / Symfony 7.4 / DBundle 2.19 / ORM 3 / lowest
            php: "8.3"
            symfony: "7.4.*"
            doctrine_bundle: "2.19"
            doctrine_bundle_major: "2"
            doctrine_orm: "3"
            doctrine_dbal: "3"
            doctrine_persistence: "3"
            prefer_lowest: true
            dependency_flags: "--prefer-lowest --prefer-stable"
            native_mbstring: false
            extensions: "pdo_sqlite, :mbstring, iconv, dom, xml, zip"
          - name: PHP 8.3 / Symfony 7.4 / DBundle 2 / ORM 3 / latest
            php: "8.3"
            symfony: "7.4.*"
            doctrine_bundle: "2"
            doctrine_bundle_major: "2"
            doctrine_orm: "3"
            doctrine_dbal: "4"
            doctrine_persistence: "4"
            prefer_lowest: false
            dependency_flags: ""
            native_mbstring: true
            extensions: "pdo_sqlite, mbstring, iconv, dom, xml, zip"
          - name: PHP 8.4 / Symfony 7.4 / DBundle 3 / ORM 3 / latest
            php: "8.4"
            symfony: "7.4.*"
            doctrine_bundle: "3"
            doctrine_bundle_major: "3"
            doctrine_orm: "3"
            doctrine_dbal: "4"
            doctrine_persistence: "4"
            dependency_flags: ""
            native_mbstring: true
            extensions: "pdo_sqlite, mbstring, iconv, dom, xml, zip"
          - name: PHP 8.4 / Symfony 8.0 / DBundle 3 / ORM 3 / latest
            php: "8.4"
            symfony: "8.0.*"
            doctrine_bundle: "3"
            doctrine_bundle_major: "3"
            doctrine_orm: "3"
            doctrine_dbal: "4"
            doctrine_persistence: "4"
            dependency_flags: ""
            native_mbstring: true
            extensions: "pdo_sqlite, mbstring, iconv, dom, xml, zip"
          - name: PHP 8.5 / Symfony 7.4 / DBundle 3 / ORM 3 / latest
            php: "8.5"
            symfony: "7.4.*"
            doctrine_bundle: "3"
            doctrine_bundle_major: "3"
            doctrine_orm: "3"
            doctrine_dbal: "4"
            doctrine_persistence: "4"
            dependency_flags: ""
            native_mbstring: true
            extensions: "pdo_sqlite, mbstring, iconv, dom, xml, zip"
          - name: PHP 8.5 / Symfony 8.x latest / DBundle 3 / ORM 3 / latest
            php: "8.5"
            symfony: "8.*"
            symfony_resolved: "8.*"
            doctrine_bundle: "3"
            doctrine_bundle_major: "3"
            doctrine_orm: "3"
            doctrine_dbal: "4"
            doctrine_persistence: "4"
            dependency_flags: ""
            native_mbstring: true
            extensions: "pdo_sqlite, mbstring, iconv, dom, xml, zip"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: "${{ matrix.extensions }}"
          tools: composer:v2
          coverage: none
      - name: Install Symfony Flex
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex:^2
      - name: Resolve dependencies
        env:
          SYMFONY_REQUIRE: "${{ matrix.symfony }}"
        run: composer update --prefer-dist --no-interaction --no-progress --with "doctrine/doctrine-bundle:^${{ matrix.doctrine_bundle }}.0" --with "doctrine/orm:^${{ matrix.doctrine_orm }}.0" ${{ matrix.dependency_flags }}
      - run: composer validate --strict
      - name: Assert resolved versions
        env:
          EXPECT_NATIVE_MBSTRING: "${{ matrix.native_mbstring }}"
        run: php .github/ci/assert-versions.php "${{ matrix.php }}" "${{ matrix.symfony_resolved || matrix.symfony }}" "${{ matrix.doctrine_bundle_major }}" "${{ matrix.doctrine_orm }}" "${{ matrix.doctrine_dbal }}" "${{ matrix.doctrine_persistence }}"
      - run: composer check-platform-reqs
      - name: PHPUnit
        env:
          SYMFONY_DEPRECATIONS_HELPER: "max[direct]=0"
        run: |
          if [[ "${{ matrix.native_mbstring }}" == "false" ]]; then
            # PHPUnit 11's launcher requires native mbstring. Calling its
            # application directly runs the same 67 tests with the polyfill.
            php -r 'require "vendor/autoload.php"; exit((new PHPUnit\TextUI\Application())->run(["phpunit"]));'
          else
            composer test
          fi

  static-analysis:
    name: Static analysis / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Symfony 7.4 / ORM 3 latest
            symfony: "7.4.*"
            symfony_resolved: "7.4.*"
            doctrine_bundle: "3"
            doctrine_orm: "3"
            doctrine_dbal: "4"
            doctrine_persistence: "4"
          - name: Symfony 8.x / ORM 3 latest
            symfony: "8.*"
            symfony_resolved: "8.*"
            doctrine_bundle: "3"
            doctrine_orm: "3"
            doctrine_dbal: "4"
            doctrine_persistence: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, mbstring, iconv, dom, xml, zip
          tools: composer:v2
          coverage: none
      - name: Install Symfony Flex
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex:^2
      - name: Resolve dependencies
        env:
          SYMFONY_REQUIRE: "${{ matrix.symfony }}"
        run: composer update --prefer-dist --no-interaction --no-progress --with "doctrine/doctrine-bundle:^${{ matrix.doctrine_bundle }}.0" --with "doctrine/orm:^${{ matrix.doctrine_orm }}.0"
      - run: composer validate --strict
      - name: Assert PHPStan and resolved versions
        env:
          EXPECT_NATIVE_MBSTRING: "true"
          EXPECT_PHPSTAN_MAJOR: "2"
        run: php .github/ci/assert-versions.php "8.4" "${{ matrix.symfony_resolved }}" "${{ matrix.doctrine_bundle }}" "${{ matrix.doctrine_orm }}" "${{ matrix.doctrine_dbal }}" "${{ matrix.doctrine_persistence }}"
      - run: composer phpstan -- --memory-limit=1G

  transactional-postgresql:
    name: Transactional PostgreSQL / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PHP 8.3 / Symfony 7.4 / DBundle 2.19 / ORM 3 / lowest
            php: "8.3"
            symfony: "7.4.*"
            doctrine_bundle: "2.19"
            doctrine_bundle_major: "2"
            doctrine_orm: "3"
            doctrine_dbal: "3"
            doctrine_persistence: "3"
            dependency_flags: "--prefer-lowest --prefer-stable"
          - name: PHP 8.5 / Symfony 8.x / DBundle 3 / ORM 3 / latest
            php: "8.5"
            symfony: "8.*"
            symfony_resolved: "8.*"
            doctrine_bundle: "3"
            doctrine_bundle_major: "3"
            doctrine_orm: "3"
            doctrine_dbal: "4"
            doctrine_persistence: "4"
            dependency_flags: ""
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auditable_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d auditable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/auditable_test?serverVersion=16&charset=utf8"
      SYMFONY_DEPRECATIONS_HELPER: "max[direct]=0"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: pdo_pgsql, mbstring, dom, xml, zip
          tools: composer:v2
          coverage: none
      - name: Install Symfony Flex
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex:^2
      - name: Resolve dependencies
        env:
          SYMFONY_REQUIRE: "${{ matrix.symfony }}"
        run: composer update --prefer-dist --no-interaction --no-progress --with "doctrine/doctrine-bundle:^${{ matrix.doctrine_bundle }}.0" --with "doctrine/orm:^${{ matrix.doctrine_orm }}.0" --with "doctrine/dbal:^${{ matrix.doctrine_dbal }}.0" --with "doctrine/persistence:^${{ matrix.doctrine_persistence }}.0" ${{ matrix.dependency_flags }}
      - run: composer validate --strict
      - name: Assert resolved versions
        env:
          EXPECT_NATIVE_MBSTRING: "true"
        run: php .github/ci/assert-versions.php "${{ matrix.php }}" "${{ matrix.symfony_resolved || matrix.symfony }}" "${{ matrix.doctrine_bundle_major }}" "${{ matrix.doctrine_orm }}" "${{ matrix.doctrine_dbal }}" "${{ matrix.doctrine_persistence }}"
      - run: composer check-platform-reqs
      - run: composer show --direct symfony/uid
      - run: composer why symfony/uid
      - run: composer test:postgresql

  package-distribution:
    name: Package distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, iconv, dom, xml, zip
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - name: Build and inspect Composer archive
        run: |
          mkdir -p /tmp/auditable-package
          composer archive --format=zip --dir=/tmp/auditable-package --file=auditable-bundle
          php .github/ci/check-package-archive.php /tmp/auditable-package/auditable-bundle.zip
      - name: Install the distributed package without development dependencies
        run: |
          mkdir -p /tmp/auditable-package/extracted
          unzip -q /tmp/auditable-package/auditable-bundle.zip -d /tmp/auditable-package/extracted
          package_root=/tmp/auditable-package/extracted
          if [[ ! -f "${package_root}/composer.json" ]]; then
            package_root="$(find "${package_root}" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          fi
          cd "${package_root}"
          composer install --no-dev --prefer-dist --no-interaction --no-progress
          composer validate --strict
          composer check-platform-reqs
          # The single-quoted program is evaluated by PHP.
          # shellcheck disable=SC2016
          php -r '
          require "vendor/autoload.php";
          foreach ([
              Zhortein\AuditableBundle\ZhorteinAuditableBundle::class,
              Zhortein\AuditableBundle\Transactional\Model\AuditEvent::class,
              Zhortein\AuditableBundle\Transactional\Contract\AuditRecorderInterface::class,
              Zhortein\AuditableBundle\Transactional\Service\StrictAuditRecorder::class,
              Zhortein\AuditableBundle\Transactional\Service\DoctrineIdentifierExtractor::class,
              Zhortein\AuditableBundle\Transactional\Service\SymfonySecurityActorResolver::class,
          ] as $type) {
              if (!class_exists($type) && !interface_exists($type)) {
                  fwrite(STDERR, "Unable to autoload ".$type.PHP_EOL);
                  exit(1);
              }
              echo "Autoloaded ".$type.PHP_EOL;
          }
          '

  coding-style:
    name: Coding style
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, mbstring, iconv, dom, xml, zip
          tools: composer:v2
          coverage: none
      - name: Install Symfony Flex
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex:^2
      - name: Resolve dependencies
        env:
          SYMFONY_REQUIRE: "7.4.*"
        run: composer update --prefer-dist --no-interaction --no-progress --with doctrine/doctrine-bundle:^3.0 --with doctrine/orm:^3.0
      - run: composer validate --strict
      - run: composer cs:check

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_sqlite, mbstring, iconv, dom, xml, zip
          tools: composer:v2
          coverage: none
      - name: Install Symfony Flex
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex:^2
      - name: Resolve dependencies
        env:
          SYMFONY_REQUIRE: "8.*"
        run: composer update --prefer-dist --no-interaction --no-progress --with doctrine/doctrine-bundle:^3.0 --with doctrine/orm:^3.0
      - run: composer validate --strict
      - run: composer audit --locked --no-interaction
