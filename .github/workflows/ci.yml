name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# DoctrineBundle 2 excludes Symfony 8. ORM 2 is outside the next release baseline.
jobs:
  compatibility:
    name: Compatibility / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PHP 8.3 / Symfony 7.4 / DBundle 2.19 / ORM 3 / lowest
            php: "8.3"
            symfony: "7.4.*"
            doctrine_bundle: "2.19"
            doctrine_bundle_major: "2"
            doctrine_orm: "3"
            doctrine_dbal: "3"
            doctrine_persistence: "3"
            dependency_flags: "--prefer-lowest --prefer-stable"
            native_mbstring: false
            extensions: "pdo_sqlite, :mbstring, iconv, dom, xml, zip"
          - name: PHP 8.3 / Symfony 7.4 / DBundle 2 / ORM 3 / latest
            php: "8.3"
            symfony: "7.4.*"
            doctrine_bundle: "2"
            doctrine_bundle_major: "2"
            doctrine_orm: "3"
            doctrine_dbal: "4"
            doctrine_persistence: "4"
            dependency_flags: ""
            native_mbstring: true
            extensions: "pdo_sqlite, mbstring, iconv, dom, xml, zip"
          - name: PHP 8.4 / Symfony 7.4 / DBundle 3 / ORM 3 / latest
            php: "8.4"
            symfony: "7.4.*"
            doctrine_bundle: "3"
            doctrine_bundle_major: "3"
            doctrine_orm: "3"
            doctrine_dbal: "4"
            doctrine_persistence: "4"
            dependency_flags: ""
            native_mbstring: true
            extensions: "pdo_sqlite, mbstring, iconv, dom, xml, zip"
          - name: PHP 8.4 / Symfony 8.0 / DBundle 3 / ORM 3 / latest
            php: "8.4"
            symfony: "8.0.*"
            doctrine_bundle: "3"
            doctrine_bundle_major: "3"
            doctrine_orm: "3"
            doctrine_dbal: "4"
            doctrine_persistence: "4"
            dependency_flags: ""
            native_mbstring: true
            extensions: "pdo_sqlite, mbstring, iconv, dom, xml, zip"
          - name: PHP 8.5 / Symfony 7.4 / DBundle 3 / ORM 3 / latest
            php: "8.5"
            symfony: "7.4.*"
            doctrine_bundle: "3"
            doctrine_bundle_major: "3"
            doctrine_orm: "3"
            doctrine_dbal: "4"
            doctrine_persistence: "4"
            dependency_flags: ""
            native_mbstring: true
            extensions: "pdo_sqlite, mbstring, iconv, dom, xml, zip"
          - name: PHP 8.5 / Symfony 8.x latest / DBundle 3 / ORM 3 / latest
            php: "8.5"
            symfony: "8.*"
            symfony_resolved: "8.1.*"
            doctrine_bundle: "3"
            doctrine_bundle_major: "3"
            doctrine_orm: "3"
            doctrine_dbal: "4"
            doctrine_persistence: "4"
            dependency_flags: ""
            native_mbstring: true
            extensions: "pdo_sqlite, mbstring, iconv, dom, xml, zip"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: "${{ matrix.extensions }}"
          tools: composer:v2
          coverage: none
      - name: Install Symfony Flex
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex:^2
      - name: Resolve dependencies
        env:
          SYMFONY_REQUIRE: "${{ matrix.symfony }}"
        run: composer update --prefer-dist --no-interaction --no-progress --with "doctrine/doctrine-bundle:^${{ matrix.doctrine_bundle }}.0" --with "doctrine/orm:^${{ matrix.doctrine_orm }}.0" ${{ matrix.dependency_flags }}
      - run: composer validate --strict
      - name: Assert resolved versions
        env:
          EXPECT_NATIVE_MBSTRING: "${{ matrix.native_mbstring }}"
        run: php .github/ci/assert-versions.php "${{ matrix.php }}" "${{ matrix.symfony_resolved || matrix.symfony }}" "${{ matrix.doctrine_bundle_major }}" "${{ matrix.doctrine_orm }}" "${{ matrix.doctrine_dbal }}" "${{ matrix.doctrine_persistence }}"
      - run: composer check-platform-reqs
      - name: PHPUnit
        env:
          SYMFONY_DEPRECATIONS_HELPER: "max[direct]=0"
        run: |
          if [[ "${{ matrix.native_mbstring }}" == "false" ]]; then
            # PHPUnit 11's launcher requires native mbstring. Calling its
            # application directly runs the same 67 tests with the polyfill.
            php -r 'require "vendor/autoload.php"; exit((new PHPUnit\TextUI\Application())->run(["phpunit"]));'
          else
            composer test
          fi

  static-analysis:
    name: Static analysis / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Symfony 7.4 / ORM 3 latest
            symfony: "7.4.*"
            doctrine_bundle: "3"
            doctrine_orm: "3"
          - name: Symfony 8.x / ORM 3 latest
            symfony: "8.*"
            doctrine_bundle: "3"
            doctrine_orm: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, mbstring, iconv, dom, xml, zip
          tools: composer:v2
          coverage: none
      - name: Install Symfony Flex
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex:^2
      - name: Resolve dependencies
        env:
          SYMFONY_REQUIRE: "${{ matrix.symfony }}"
        run: composer update --prefer-dist --no-interaction --no-progress --with "doctrine/doctrine-bundle:^${{ matrix.doctrine_bundle }}.0" --with "doctrine/orm:^${{ matrix.doctrine_orm }}.0"
      - run: composer validate --strict
      - run: composer phpstan -- --memory-limit=512M

  coding-style:
    name: Coding style
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, mbstring, iconv, dom, xml, zip
          tools: composer:v2
          coverage: none
      - name: Install Symfony Flex
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex:^2
      - name: Resolve dependencies
        env:
          SYMFONY_REQUIRE: "7.4.*"
        run: composer update --prefer-dist --no-interaction --no-progress --with doctrine/doctrine-bundle:^3.0 --with doctrine/orm:^3.0
      - run: composer validate --strict
      - run: composer cs:check

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_sqlite, mbstring, iconv, dom, xml, zip
          tools: composer:v2
          coverage: none
      - name: Install Symfony Flex
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex:^2
      - name: Resolve dependencies
        env:
          SYMFONY_REQUIRE: "8.*"
        run: composer update --prefer-dist --no-interaction --no-progress --with doctrine/doctrine-bundle:^3.0 --with doctrine/orm:^3.0
      - run: composer validate --strict
      - run: composer audit --locked --no-interaction
